services:
  honeypot:
    build: .
    container_name: ssh-honeypot
    ports:
      - "2222:2222"    # SSH
      - "8080:8080"    # HTTP
      - "2121:2121"    # FTP
      # Dashboard solo en localhost del host: se accede por tunel SSH, nunca publico
      - "127.0.0.1:5000:5000"
    volumes:
      # Montar la carpeta logs en tu PC para ver los datos capturados
      # aunque el contenedor se reinicie
      - ./logs:/app/logs
    environment:
      - GEO_ENABLED=true
      - EMAIL_ENABLED=false
      - THREAT_INTEL_ENABLED=false
      # La clave viene del archivo .env (fuera de git), nunca del codigo
      - VIRUSTOTAL_KEY=${VIRUSTOTAL_KEY:-}
      # IPs propias a ignorar (se define en .env, fuera de git). Ej: 203.0.113.5,198.51.100.7
      - HONEYPOT_IGNORE_IPS=${HONEYPOT_IGNORE_IPS:-}
    # Docker no rota los logs por defecto: con trafico real el archivo crece sin limite
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped    # Se reinicia automáticamente si falla
    # --- Endurecimiento del contenedor ---
    # El honeypot recibe trafico hostil: se le saca todo lo que no necesita.
    read_only: true            # El sistema de archivos del contenedor es de solo lectura
    tmpfs:
      - /tmp                   # Espacio temporal en memoria (se borra al reiniciar)
    cap_drop:
      - ALL                    # Sin capacidades de Linux: no usa puertos bajos ni toca la red a bajo nivel
    security_opt:
      - no-new-privileges:true # Ningun proceso puede ganar privilegios (por ejemplo via setuid)
    pids_limit: 1024           # Tope de procesos e hilos (cada conexion usa uno): frena una fuga o un ataque de agotamiento
    mem_limit: 1g              # Tope de memoria